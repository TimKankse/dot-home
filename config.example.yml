# Editorial OS Configuration Example
# Copy this file to config.yml and customize for your setup
# API keys added through the UI will be stored here (encrypted)

widgets: []

scrollDirection: vertical

pages:
  - id: default-page

integrations: []

settings:
  behavior:
    confirmEdit: false
    autoSave: true
    refreshInterval: 10
    autoDetectLocation: true
  display:
    is24Hour: true
    temperatureUnit: C
    dateFormat: DD/MM
    language: en
    timezone: auto
    location: ""
  shortcuts:
    toggleEdit: Alt+E
    openSettings: Alt+,
    addItem: Alt+N
    saveChanges: Alt+S
    prevPage: Alt+ArrowLeft
    nextPage: Alt+ArrowRight

